<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura AWS do PulseOps</title><desc id="desc">Usuário acessa CloudFront, que lê um bucket S3 privado. Uma VPC própria abriga Zabbix em EC2 em sub-rede pública restrita.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b25"/><stop offset="1" stop-color="#123844"/></linearGradient><linearGradient id="mint" x1="0" x2="1"><stop stop-color="#6de0c2"/><stop offset="1" stop-color="#2d977f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#031016" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" fill="#6de0c2" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">PULSEOPS / ARCHITECTURE MAP</text><text x="60" y="91" fill="#f2fffb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Da borda pública à origem protegida</text>
  <text x="60" y="132" fill="#a8c4be" font-family="Arial,sans-serif" font-size="13">Somente o CloudFront aceita tráfego público. A origem S3 usa OAC.</text>
  <path d="M245 267H340M525 267H625M810 267H915" fill="none" stroke="#6de0c2" stroke-width="2" stroke-dasharray="7 7"/><path d="M720 338V400" fill="none" stroke="#a391d9" stroke-width="2" stroke-dasharray="7 7"/>
  <g filter="url(#shadow)"><rect x="80" y="215" width="165" height="105" rx="14" fill="#f4fbf8"/><rect x="340" y="215" width="185" height="105" rx="14" fill="#f4fbf8"/><rect x="625" y="215" width="185" height="105" rx="14" fill="#f4fbf8"/><rect x="915" y="215" width="205" height="105" rx="14" fill="#f4fbf8"/><rect x="625" y="400" width="190" height="60" rx="14" fill="#efeafe"/></g>
  <g font-family="Arial,sans-serif"><text x="106" y="246" fill="#759790" font-size="11">ENTRADA</text><text x="106" y="273" fill="#21444b" font-size="18" font-weight="700">Usuário</text><text x="106" y="297" fill="#4b8175" font-size="11">HTTPS / 443</text>
  <text x="368" y="246" fill="#759790" font-size="11">DISTRIBUIÇÃO</text><text x="368" y="273" fill="#21444b" font-size="18" font-weight="700">CloudFront</text><text x="368" y="297" fill="#4b8175" font-size="11">TLS + OAC habilitado</text>
  <text x="653" y="246" fill="#b08a51" font-size="11">ORIGEM PRIVADA</text><text x="653" y="273" fill="#21444b" font-size="18" font-weight="700">S3 bucket</text><text x="653" y="297" fill="#9d7a48" font-size="11">pulseops-web / privado</text>
  <text x="943" y="246" fill="#759790" font-size="11">VPC · 10.0.0.0/16</text><text x="943" y="273" fill="#21444b" font-size="18" font-weight="700">EC2 / Zabbix</text><text x="943" y="297" fill="#4b8175" font-size="11">HTTP check · 1 min</text>
  <text x="653" y="425" fill="#8877bd" font-size="11">OBSERVABILIDADE</text><text x="653" y="448" fill="#4b3d78" font-size="15" font-weight="700">Alertas 404 + latência &gt; 2s</text></g>
  <rect x="60" y="365" width="490" height="1" fill="#315763"/><text x="60" y="397" fill="#8eb0aa" font-family="Arial,sans-serif" font-size="11">PUBLIC SUBNET</text><text x="60" y="421" fill="#f2fffb" font-family="monospace" font-size="14">10.0.10.0/24</text><text x="60" y="445" fill="#8eb0aa" font-family="Arial,sans-serif" font-size="11">IGW · Security Group restrito · SSH por IP administrativo</text>
  <text x="915" y="397" fill="#8eb0aa" font-family="Arial,sans-serif" font-size="11">PRIVATE ORIGIN / DATA</text><text x="915" y="421" fill="#f2fffb" font-family="monospace" font-size="14">10.0.20.0/24 · 10.0.30.0/26</text><text x="915" y="445" fill="#8eb0aa" font-family="Arial,sans-serif" font-size="11">sem rota direta para a internet</text>
</svg>
